<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="proposal-container" class="container active">
        <h1 class="neon-text">Will You Be My Girlfriend?</h1>
        <div class="buttons">
            <button id="yes-btn" class="neon-btn yes">YES</button>
            <button id="no-btn" class="neon-btn no">NO</button>
        </div>
    </div>

    <div id="success-container" class="container hidden">
        <h1 class="neon-text success">Yay! Let's Go On A Date! ❤️</h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
